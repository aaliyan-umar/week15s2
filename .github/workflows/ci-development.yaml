name: wf-ci-development
on: 
  pull_request:
    branches:
      - develop
jobs:
  ci-development-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository 
        uses: actions/checkout@v4
      - name: Lint HTML and Css
        run: |
          npx htmlhint "**/*.html"
          npx stylehint "**/*.css"
      - name: Test Build Ops
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"       
